services:
  postgres_local:
    image: postgres:18-alpine
    container_name: uva_postgres_local
    environment:
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password_123
      POSTGRES_DB: uva_local_db
    volumes:
      - uva_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-local_user} -d ${POSTGRES_DB:-uva_local_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api_local:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: uva_nestjs_local
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    command: sh -c "until nc -z postgres_local 5432; do echo 'Aguardando postgres...'; sleep 2; done; npx prisma migrate deploy && npm run start:dev"
    volumes:
      - .:/app
      - uva_api_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres_local:
        condition: service_healthy

volumes:
  uva_db_data:
  uva_api_node_modules:
