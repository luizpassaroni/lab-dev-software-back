services:
  postgres:
    image: postgres:16-alpine
    container_name: uva_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uva_admin_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TOo!f!cHU536p$}
      POSTGRES_DB: ${POSTGRES_DB:-uva_nestjs_db}
    volumes:
      - uva_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: always

  api:
    image: ghcr.io/luizpassaroni/nestjs-api:latest
    container_name: uva_nestjs_api_prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://uva_admin_prod:TOo!f!cHU536p$@postgres:5432/uva_nestjs_db}
      PORT: ${PORT:-3000}
    ports:
      - "80:3000"
    depends_on:
      - postgres
    restart: always

volumes:
  uva_db_data:
