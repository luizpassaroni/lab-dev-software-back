name: CI/CD Pipeline - Azure & Docker

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/**'
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'prisma.config.ts'

jobs:
  infra-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      PUBLIC_IP: ${{ steps.bicep-deploy.outputs.publicIpAddress }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy da Infra (Bicep)
        id: bicep-deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: rg-faculdade-prod
          template: ./infra/main.bicep
          parameters: >
            sshPublicKey="${{ secrets.SSH_PUBLIC_KEY }}"

      - name: Logar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildar e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nestjs-api:latest
            ghcr.io/${{ github.repository_owner }}/nestjs-api:${{ github.sha }}

  deploy-to-vm:
    needs: infra-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Executar Deploy na VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ needs.infra-and-build.outputs.PUBLIC_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROD_POSTGRES_PASSWORD,GITHUB_TOKEN
          script: |
            if ! command -v docker &> /dev/null; then
              sudo apt update -y
              sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              sudo apt install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt update -y
              sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable --now docker
              sudo usermod -aG docker deployer
            fi
            
            mkdir -p ~/app
            cd ~/app
            
            curl -sSL "https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml?v=${{ github.sha }}" -o docker-compose.yml
            
            cat << EOF > .env
            POSTGRES_USER=uva_admin_prod
            POSTGRES_PASSWORD=$PROD_POSTGRES_PASSWORD
            POSTGRES_DB=uva_nestjs_db
            PORT=3000
            EOF
            
            cat << 'EOF' > Caddyfile
            api-uva.eduoncode.com {
              reverse_proxy api:3000
            }
            EOF
            
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull
            docker compose up -d --force-recreate
            
            echo "Aguardando o banco de dados/API ficarem prontos para executar as migrations..."
            attempts=0
            max_attempts=12
            until docker compose exec -T api npx prisma migrate deploy; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge "$max_attempts" ]; then
                echo "Falha ao executar migrations após $max_attempts tentativas."
                exit 1
              fi
              echo "Migrations ainda não disponíveis; aguardando 10s... ($attempts/$max_attempts)"
              sleep 10
            done
